server:
  port: 8080

logging:
  level:
    root: warn

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: monitoring-service
              uri: http://monitoring:8084
              predicates:
                - Path=/api/monitoring/**
              filters:
                - StripPrefix=1

            - id: auth-service
              uri: http://authentication:8083
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: users-service
              uri: http://users:8082
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: devices-service
              uri: http://devices:8081
              predicates:
                - Path=/api/devices/**
              filters:
                - StripPrefix=1

jwt:
  secret: heardtheyreformingthedawnguardvampirehuntersorsomething
  header: Authorization
  prefix: Bearer
