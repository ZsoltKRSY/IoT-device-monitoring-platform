<div class="overlay" (click)="onCancel()"></div>
<div class="dialog">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="action-buttons">
        <button class="btn cancel-btn" (click)="onCancel()">Cancel</button>
        <button class="btn confirm-btn" (click)="onConfirm()">Confirm</button>
    </div>
</div>
