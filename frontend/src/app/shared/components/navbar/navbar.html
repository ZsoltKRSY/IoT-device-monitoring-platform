<nav class="navbar">
    <div class="nav-left">
        <a class="logo" routerLink="/">⚡ Energy Dashboard</a>
        <ng-container *ngIf="!authUser?.isAdmin">
            <a routerLink="/my-devices" routerLinkActive="active">My Devices</a>
            <a routerLink="/my-consumption" routerLinkActive="active">Energy Consumption</a>
        </ng-container>
        <ng-container *ngIf="authUser?.isAdmin">
            <a routerLink="/admin/devices" routerLinkActive="active">Devices</a>
            <a routerLink="/admin/users" routerLinkActive="active">Users</a>
        </ng-container>
    </div>

    <div class="nav-right">
        <button class="profile-btn" (click)="toggleProfile()">
            <span class="dots">⋯</span>
        </button>

        <div *ngIf="showProfile" class="profile-dropdown">
            <button (click)="openProfileModal()">Profile</button>
            <button (click)="logout()">Logout</button>
        </div>
    </div>
</nav>

<app-profile-modal *ngIf="showProfileModal" [authUser]="authUser" [user]="user" (close)="closeProfileModal()">
</app-profile-modal>
