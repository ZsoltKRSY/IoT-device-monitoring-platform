<div class="login-wrapper">
    <div class="login-card">
        <h2 class="title">Welcome Back!</h2>
        <p class="subtitle">Sign in to continue</p>

        <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="login-form">

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" [(ngModel)]="username"
                    placeholder="Enter your username" [disabled]="loading" required />
                <div class="input-error">{{ usernameError || '\u00A0' }}</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" [(ngModel)]="password"
                    placeholder="Enter your password" [disabled]="loading" required />
                <div class="input-error">{{ passwordError || '\u00A0' }}</div>
            </div>

            <button type="submit" class="btn-login" [disabled]="loading">
                {{ loading ? 'Logging in...' : 'Login' }}
            </button>

            <div class="input-error login-error">{{ loginError || '\u00A0' }}</div>

            <p class="register-link">
                Don't have an account?
                <a [routerLink]="['/register']">Register here</a>
            </p>

        </form>
    </div>
</div>
